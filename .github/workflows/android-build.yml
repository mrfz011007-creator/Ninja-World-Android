name: Godot Android Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate project and export debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Godot 4.7.2 and Android export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: "4.7.2"
          include-templates: true
          use-dotnet: false

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          godot --version
          java -version
          sdkmanager --version

      - name: Validate repository structure
        run: python3 tests/validate_project.py

      - name: Import project and check scripts
        run: godot --headless --path game --editor --quit

      - name: Smoke-test main scene
        run: godot --headless --path game --quit-after 3

      - name: Export Android debug APK
        run: |
          mkdir -p game/build
          godot --headless --path game --export-debug "Android" build/NinjaWorld-debug.apk
          test -s game/build/NinjaWorld-debug.apk
          unzip -t game/build/NinjaWorld-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose game/build/NinjaWorld-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NinjaWorld-debug-apk
          path: game/build/NinjaWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
